# Một cổng vào duy nhất: UI + /api/ + /n8n/
# Truy cập qua domain (vd. shipment.example.com) phải trỏ vào container/service này (cổng 80),
# KHÔNG chỉ trỏ thẳng frontend :3000 nếu không có proxy /api.

server {
  listen 80;
  server_name _;

  client_max_body_size 20m;

  # API FastAPI — giữ nguyên prefix /api/ (proxy_pass KHÔNG có dấu / cuối)
  location /api/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
  }

  location = /api {
    return 301 /api/;
  }

  # n8n (editor + webhook) — không redirect localhost
  location /n8n/ {
    proxy_pass http://n8n:5678/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600;
  }

  location = /n8n {
    return 301 /n8n/;
  }

  # Frontend (Vite dev trong Docker)
  location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600;
  }
}
