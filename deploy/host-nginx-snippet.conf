# Ví dụ: Nginx trên VPS (ngoài Docker) — domain shipment.snaptikdown.site
# Thay 127.0.0.1:8080 bằng cổng docker compose map cho service nginx (mặc định 8080:80).
#
# QUAN TRỌNG: proxy_pass /api/ phải giữ prefix /api — KHÔNG dùng:
#   location /api/ { proxy_pass http://127.0.0.1:8000/; }  ← sẽ 404 "Not Found"

server {
  listen 80;
  server_name shipment.snaptikdown.site;

  location / {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
